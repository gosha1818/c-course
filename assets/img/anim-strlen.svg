<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace"><rect width="640" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="20" y="30" font-size="16" font-weight="bold" fill="#0f172a">Как функции находят конец строки</text><rect x="110" y="90" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="155.0" y="126.0" text-anchor="middle" font-size="20" fill="#075985">'a'</text><text x="155.0" y="80" text-anchor="middle" font-size="13" fill="#6b7280">s[0]</text><rect x="220" y="90" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="265.0" y="126.0" text-anchor="middle" font-size="20" fill="#075985">'b'</text><text x="265.0" y="80" text-anchor="middle" font-size="13" fill="#6b7280">s[1]</text><rect x="330" y="90" width="90" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="375.0" y="126.0" text-anchor="middle" font-size="20" fill="#075985">'c'</text><text x="375.0" y="80" text-anchor="middle" font-size="13" fill="#6b7280">s[2]</text><rect x="440" y="90" width="90" height="60" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="485.0" y="126.0" text-anchor="middle" font-size="20" fill="#991b1b">\0</text><text x="485.0" y="80" text-anchor="middle" font-size="13" fill="#6b7280">s[3]</text><text x="20" y="126.0" font-size="18" fill="#334155">s</text><g opacity="0"><polygon points="145.0,186 165.0,186 155.0,164" fill="#f59e0b"/><text x="155.0" y="206" text-anchor="middle" font-size="14" fill="#b45309">i = 0</text><text x="320" y="245" text-anchor="middle" font-size="16" fill="#166534">s[0] != '\0'  →  символ учтён, len = 1</text><animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.00000;0.20000" dur="10s" repeatCount="indefinite"/></g><g opacity="0"><rect x="110" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><polygon points="255.0,186 275.0,186 265.0,164" fill="#f59e0b"/><text x="265.0" y="206" text-anchor="middle" font-size="14" fill="#b45309">i = 1</text><text x="320" y="245" text-anchor="middle" font-size="16" fill="#166534">s[1] != '\0'  →  символ учтён, len = 2</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.00000;0.20000;0.40000" dur="10s" repeatCount="indefinite"/></g><g opacity="0"><rect x="110" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><rect x="220" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><polygon points="365.0,186 385.0,186 375.0,164" fill="#f59e0b"/><text x="375.0" y="206" text-anchor="middle" font-size="14" fill="#b45309">i = 2</text><text x="320" y="245" text-anchor="middle" font-size="16" fill="#166534">s[2] != '\0'  →  символ учтён, len = 3</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.00000;0.40000;0.60000" dur="10s" repeatCount="indefinite"/></g><g opacity="0"><rect x="110" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><rect x="220" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><rect x="330" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><polygon points="475.0,186 495.0,186 485.0,164" fill="#f59e0b"/><text x="485.0" y="206" text-anchor="middle" font-size="14" fill="#b45309">i = 3</text><text x="320" y="245" text-anchor="middle" font-size="16" fill="#991b1b">s[3] == '\0'  →  конец строки, цикл останавливается</text><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.00000;0.60000;0.80000" dur="10s" repeatCount="indefinite"/></g><g opacity="0"><rect x="110" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><rect x="220" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><rect x="330" y="90" width="90" height="60" rx="6" fill="#86efac" fill-opacity="0.3" stroke="#16a34a" stroke-width="3"/><text x="320" y="245" text-anchor="middle" font-size="16" fill="#0f172a">Итог: strlen(s) = 3, а sizeof(s) = 4 (с учётом '\0')</text><animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.00000;0.80000" dur="10s" repeatCount="indefinite"/></g></svg>